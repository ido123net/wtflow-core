[project]
name = "wtflow-core"
version = "0.0.0"
description = "Core package for async workflow orchestration"
readme = "README.md"
authors = [
    { name = "Ido Frenkel", email = "ido123net@gmail.com" }
]
requires-python = ">=3.10"

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "covdefaults>=2.3.0",
    "mypy>=1.15.0",
    "pre-commit>=4.3.0",
    "pytest>=8.3.4",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.0.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["I"]

[tool.coverage.run]
source = ["src", "tests"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 100

[tool.mypy]
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
